<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b5e20">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Calagem Agro</title>
<style>
:root{--bg:#0f1a12;--card:#18281c;--bd:#2a4030;--tx:#eaf3ec;--mt:#93ab98;--ac:#f5c518;--gr:#2e7d32}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{background:var(--gr);padding:16px;text-align:center}
header h1{margin:0;font-size:20px}header small{opacity:.85}
main{max-width:520px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:14px;margin:0 0 10px;color:var(--ac);text-transform:uppercase;letter-spacing:.5px}
label{display:block;font-size:12px;color:var(--mt);margin:8px 0 3px}
input,select{width:100%;padding:12px;font-size:17px;border-radius:10px;border:1px solid var(--bd);background:#0f1a12;color:var(--tx)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tabs{display:flex;gap:8px;margin-bottom:6px}
.tabs button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--bd);background:transparent;color:var(--mt);font-size:14px}
.tabs button.on{background:var(--gr);color:#fff;border-color:var(--gr)}
.res{text-align:center}
.big{font-size:44px;font-weight:800;color:var(--ac);line-height:1.1}
.res p{margin:4px 0;color:var(--mt);font-size:14px}.res b{color:var(--tx)}
.warn{color:#ffb74d}
.btn{width:100%;padding:13px;border-radius:10px;border:0;background:var(--ac);color:#000;font-weight:700;font-size:16px;margin-top:8px}
.btn.s{background:transparent;color:var(--mt);border:1px solid var(--bd)}
footer{text-align:center;color:var(--mt);font-size:11px;padding:10px 0 24px}
#inst{display:none}
</style>
</head>
<body>
<header><h1>🌱 Calagem Agro</h1><small>Método da saturação por bases</small></header>
<main>
<div class="card">
<h2>Análise de solo</h2>
<div class="tabs"><button id="t1" class="on" onclick="modo(1)">Tenho o V%</button><button id="t2" onclick="modo(2)">Calcular V%</button></div>
<div id="m1"><label>V% atual (V1)</label><input id="v1" type="number" inputmode="decimal" placeholder="ex.: 35"><label>CTC a pH 7 (cmolc/dm³)</label><input id="ctc" type="number" inputmode="decimal" placeholder="ex.: 6,0"></div>
<div id="m2" style="display:none">
<div class="row"><div><label>Ca (cmolc/dm³)</label><input id="ca" type="number" inputmode="decimal"></div><div><label>Mg (cmolc/dm³)</label><input id="mg" type="number" inputmode="decimal"></div></div>
<div class="row"><div><label>K</label><input id="k" type="number" inputmode="decimal"></div><div><label>Unidade do K</label><select id="ku"><option value="c">cmolc/dm³</option><option value="m">mg/dm³</option></select></div></div>
<label>H+Al (cmolc/dm³)</label><input id="hal" type="number" inputmode="decimal">
<p id="calc" style="color:var(--mt);font-size:13px;margin:8px 0 0"></p></div>
</div>
<div class="card">
<h2>Cultura e calcário</h2>
<label>Cultura (V2 sugerido)</label>
<select id="cult" onchange="cultura()"><option value="60">Soja — 60%</option><option value="60">Milho — 60%</option><option value="50">Algodão — 60%</option><option value="55">Feijão — 55%</option><option value="50">Pastagem — 50%</option><option value="70">Hortaliças — 70%</option><option value="">Outra (digitar)</option></select>
<div class="row"><div><label>V2 alvo (%)</label><input id="v2" type="number" inputmode="decimal" value="60"></div><div><label>PRNT (%)</label><input id="prnt" type="number" inputmode="decimal" value="80"></div></div>
<div class="row"><div><label>Profundidade (cm)</label><input id="prof" type="number" inputmode="decimal" value="20"></div><div><label>Área (ha)</label><input id="area" type="number" inputmode="decimal" placeholder="opcional"></div></div>
</div>
<div class="card res" id="out"><p>Preencha os dados</p></div>
<button id="inst" class="btn">📲 Instalar app</button>
<button class="btn s" onclick="limpar()">Limpar</button>
<footer>NC = (V2 − V1) × CTC ÷ PRNT · Desenvolvido por João Divino Barbosa</footer>
</main>
<script>
const $=id=>document.getElementById(id);
const n=id=>{const v=parseFloat(String($(id).value).replace(',','.'));return isNaN(v)?null:v};
const f=(x,d=2)=>x.toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
let M=1;
const IDS=['v1','ctc','ca','mg','k','ku','hal','v2','prnt','prof','area','cult'];
function modo(m){M=m;$('m1').style.display=m==1?'':'none';$('m2').style.display=m==2?'':'none';$('t1').className=m==1?'on':'';$('t2').className=m==2?'on':'';calc()}
function cultura(){const v=$('cult').value;if(v!=='')$('v2').value=v;calc()}
function calc(){
 let V1,CTC;
 if(M==1){V1=n('v1');CTC=n('ctc')}
 else{
  const ca=n('ca'),mg=n('mg'),hal=n('hal');let k=n('k');
  if(k!==null&&$('ku').value=='m')k=k/391;
  if(ca!==null&&mg!==null&&k!==null&&hal!==null){const sb=ca+mg+k;CTC=sb+hal;V1=sb/CTC*100;
   $('calc').innerHTML=`SB = <b>${f(sb)}</b> · CTC = <b>${f(CTC)}</b> · V1 = <b>${f(V1,1)}%</b>`}
  else{$('calc').textContent='';V1=null}
 }
 const V2=n('v2'),P=n('prnt'),pf=n('prof')||20,ar=n('area');
 try{localStorage.setItem('calagem',JSON.stringify(Object.fromEntries(IDS.map(i=>[i,$(i).value]).concat([['M',M]]))))}catch(e){}
 const o=$('out');
 if(V1===null||CTC===null||V2===null||!P){o.innerHTML='<p>Preencha os dados</p>';return}
 if(P<=0){o.innerHTML='<p class="warn">PRNT inválido</p>';return}
 const nc=(V2-V1)*CTC/P;
 if(nc<=0){o.innerHTML=`<p>V1 (${f(V1,1)}%) já atinge o alvo.</p><div class="big">0</div><p><b>Calagem não necessária</b></p>`;return}
 const ncp=nc*pf/20;
 let h=`<p>Necessidade de calcário</p><div class="big">${f(ncp)}</div><p><b>t/ha</b> (PRNT ${f(P,0)}%, ${f(pf,0)} cm)</p><p>V1 ${f(V1,1)}% → V2 ${f(V2,0)}% · CTC ${f(CTC)}</p>`;
 if(ar)h+=`<p>Total para ${f(ar,1)} ha: <b>${f(ncp*ar)} t</b></p>`;
 if(ncp>6)h+='<p class="warn">⚠ Acima de 6 t/ha: considere parcelar a aplicação.</p>';
 o.innerHTML=h;
}
function limpar(){IDS.forEach(i=>{if(!['v2','prnt','prof','cult','ku'].includes(i))$(i).value=''});calc()}
document.querySelectorAll('input,select').forEach(e=>e.addEventListener('input',calc));
try{const s=JSON.parse(localStorage.getItem('calagem')||'null');if(s){IDS.forEach(i=>{if(s[i]!==undefined)$(i).value=s[i]});modo(s.M||1)}}catch(e){}
calc();
let dp;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$('inst').style.display='block'});
$('inst').onclick=async()=>{if(dp){dp.prompt();await dp.userChoice;dp=null;$('inst').style.display='none'}};
window.addEventListener('appinstalled',()=>$('inst').style.display='none');
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
